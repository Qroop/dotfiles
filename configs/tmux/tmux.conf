set -g prefix C-f
unbind C-b
bind C-f send-prefix

set-option -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g status-keys emacs
set -g mouse on
set -g mode-keys vi
set -g renumber-windows on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind R command-prompt -I "#{session_name}" "rename-session '%%'" 
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind n new-window
bind X confirm-before -p "Kill session #S? (y/n)" kill-session 
bind-key -n C-a run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

bind v copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/tmux-clipboard.sh"
bind -T copy-mode-vi Escape send -X cancel

unbind '"'
unbind %

set -g command-alias[0] reload='source-file ~/.config/tmux/tmux.conf' 

# Center the window list
set -g status-justify left

set -g status on
set -g status-style "bg=default,fg=#7a7a7a"
set -g status-left-length 30
set -g status-left "#[fg=#6f9f60,bold]#S #[default]"
set -g status-right "#[fg=#7a7a7a]%H:%M"
set -g window-status-separator ""
set -g window-status-format "#{?#{==:#{session_windows},1},, #I:#W }"
set -g window-status-current-format "#{?#{==:#{session_windows},1},, #I:#W }"
set -g window-status-current-style "fg=#deeeed,bold"
set -g message-style "bg=#141414,fg=#deeeed"
set -g message-command-style "bg=#141414,fg=#deeeed"
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#6f9f60"
set -g mode-style "bg=#2a2a2a,fg=#deeeed"
